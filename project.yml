name: PTTMarquee
options:
  bundleIdPrefix: com.pttmarquee
  deploymentTarget:
    macOS: "13.0"
settings:
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  SWIFT_VERSION: "5.9"
  GENERATE_INFOPLIST_FILE: YES
  CURRENT_PROJECT_VERSION: 3
  MARKETING_VERSION: "1.0.2"
targets:
  PTTMarquee:
    type: application
    platform: macOS
    sources:
      - path: PTTMarquee
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pttmarquee.PTTMarquee
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 PTT Marquee. All rights reserved."
      INFOPLIST_KEY_CFBundleDisplayName: "PTT Marquee"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      COMBINE_HIDPI_IMAGES: YES
  PTTMarqueeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PTTMarqueeTests
    dependencies:
      - target: PTTMarquee
schemes:
  PTTMarquee:
    build:
      targets:
        PTTMarquee: all
        PTTMarqueeTests: [test]
    test:
      targets:
        - PTTMarqueeTests
